<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Small dictionary of Etruscan language</title>
    
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-49WKN3NH9J"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-49WKN3NH9J');
    </script>

    <!-- Google Fonts for modern typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --primary-color: #2c3e50;
            --accent-color: #8b0000; /* Imperial Roman Red */
            --text-color: #333333;
            --text-muted: #6c757d;
            --border-color: #e9ecef;
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.7;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: var(--shadow);
        }

        header h1 {
            font-family: 'Cinzel', serif;
            color: var(--primary-color);
            text-align: center;
            font-size: 2.2rem;
            margin-bottom: 25px;
            letter-spacing: 0.5px;
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 15px;
        }

        .description {
            font-size: 1.05rem;
            color: var(--text-muted);
            text-align: left;
            margin-bottom: 35px;
        }

        /* Gallery Grid */
        .image-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .image-card {
            background: var(--bg-color);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            border: 1px solid var(--border-color);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .image-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .image-card img {
            width: 100%;
            height: 320px;
            object-fit: contain;
            border-radius: 4px;
        }

        .image-card p {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-top: 10px;
            margin-bottom: 0;
            font-weight: 600;
        }


  /* Styled List Items */
        .translation-list {
            list-style: none;
            padding-left: 0;
            margin-bottom: 30px;
        }

        .translation-list li {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px 18px;
            margin-bottom: 10px;
            font-size: 0.98rem;
        }

        .translation-list li code {
            font-family: 'Georgia', serif;
            font-weight: bold;
            color: var(--accent-color);
            background: rgba(139, 0, 0, 0.05);
            padding: 2px 6px;
            border-radius: 4px;
            margin-right: 8px;
        }



        
        /* Original Text Block */
        .original-text-section {
            background-color: #f4f1ea; /* Soft parchment tint */
            border-left: 4px solid var(--accent-color);
            padding: 20px 25px;
            border-radius: 0 8px 8px 0;
            margin-bottom: 40px;
        }

        .original-text-section h2 {
            font-family: 'Cinzel', serif;
            font-size: 1.1rem;
            color: var(--accent-color);
            margin-top: 0;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .original-text {
            font-family: 'Georgia', serif;
            font-style: italic;
            font-size: 1.25rem;
            color: #111;
            margin: 0;
            word-spacing: 2px;
        }

        /* Translations Section */
        .translations-section h2 {
            font-family: 'Cinzel', serif;
            color: var(--primary-color);
            font-size: 1.4rem;
            margin-bottom: 20px;
        }

        .translation-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .translation-item {
            padding: 18px 20px;
            background: var(--bg-color);
            border-radius: 8px;
            border-left: 3px solid var(--primary-color);
        }

        .language-label {
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 1px;
            color: var(--text-muted);
            display: block;
            margin-bottom: 5px;
        }

        .translation-text {
            font-size: 1.05rem;
            margin: 0;
            color: var(--text-color);
        }

        /* Responsive tweaks */
        @media (max-width: 600px) {
            body {
                padding: 15px 10px;
            }
            .container {
                padding: 20px;
            }
            header h1 {
                font-size: 1.6rem;
            }
            .image-card img {
                height: 240px;
            }
        }
    </style>
</head>
<body>
     <p><a href="https://townames.github.io/Rasnal/" style="text-decoration: none; color: #e67e22;">← Back to main page</a></p>
  
<div class="container">
    <header>
        <h1>Small dictionary of Etruscan language</h1>
    </header>

    <p class="description">
        This dictionary contains only those words that differ from the translations accepted by the academic community.
    </p>
<a>SPURIA, SPURIE - The child. Most likely a daughter.</a> <br>
<a>VEL, VELIA, VELUS - The spirit of death.</a> <br>
</div>
